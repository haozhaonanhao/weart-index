name: Daily Update
on:
  schedule:
    # 每天 UTC 02:00 = 北京时间 10:00
    - cron: "0 2 * * *"
  workflow_dispatch: {}   # 支持手动触发（仓库 Actions 页面点 Run workflow）

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 运行每日抓取更新
        run: python .github/scripts/daily_update.py

      - name: 提交并推送更新
        run: |
          git config user.name "WeArt Bot"
          git config user.email "bot@weart-index.local"
          git add news.html archive/
          git diff --cached --quiet || git commit -m "Daily update $(date +%Y-%m-%d)"
          git push
