<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>新闻管理 · WeArt Index CMS</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <style>
    .admin-layout { display:grid; grid-template-columns:220px 1fr; min-height:100vh; }
    .admin-sidebar { background:var(--ink); color:var(--white); padding:28px 20px; }
    .admin-sidebar .logo { font-weight:800; font-size:18px; letter-spacing:0.04em; margin-bottom:36px; display:block; color:var(--white) }
    .admin-sidebar nav a { display:flex; align-items:center; gap:10px; padding:11px 14px; margin-bottom:4px; color:rgba(255,255,255,0.65); border-radius:4px; font-size:13.5px; transition:0.15s }
    .admin-sidebar nav a:hover,.admin-sidebar nav a.on { background:rgba(255,255,255,0.08); color:var(--white) }
    .admin-main { padding:36px 40px; background:var(--paper); }
    .filter-bar-admin { display:flex; gap:16px; flex-wrap:wrap; align-items:center; margin-bottom:24px }
    .filter-bar-admin select, .filter-bar-admin input { border:1px solid var(--line); border-radius:var(--radius); padding:9px 12px; font-size:13px; font-family:inherit }
    .news-table { width:100%; border-collapse:collapse; font-size:13px; background:var(--white); border:1px solid var(--line); border-radius:var(--radius) }
    .news-table th { text-align:left; font-size:11px; letter-spacing:0.12em; color:var(--muted); padding:10px 12px; border-bottom:2px solid var(--ink); background:var(--white) }
    .news-table td { padding:12px; border-bottom:1px solid var(--line) }
    .news-table a { color:var(--ink) }
    .news-table a:hover { color:var(--accent-deep) }
    .action-icons { display:flex; gap:10px }
    .action-icons button { font-size:12px; padding:4px 10px; border-radius:2px; border:1px solid var(--line); background:var(--white); cursor:pointer }
    @media (max-width:768px){ .admin-layout{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <a class="logo" href="dashboard.html">WeArt<span style="color:var(--accent)">·</span>Index <small style="font-size:10px;letter-spacing:0.2em;color:rgba(255,255,255,0.4)">CMS</small></a>
      <nav>
        <a href="dashboard.html">📊 控制台</a>
        <a href="news-list.html" class="on">📰 新闻管理</a>
        <a href="news-editor.html">✏️ 发布新闻</a>
        <a href="report-gen.html">📋 日报生成</a>
        <a href="source-mgr.html">🔗 来源管理</a>
      </nav>
    </aside>
    <main class="admin-main">
      <div class="section-head" style="padding:0;margin-bottom:20px">
        <div><div class="kicker">News Manager · 新闻管理</div><h2 class="h2" style="font-size:22px">新闻列表 <em>/ 66 条</em></h2></div>
        <a class="btn btn-accent btn-sm" href="news-editor.html">+ 发布新闻</a>
      </div>

      <div class="filter-bar-admin">
        <select><option>全部赛道</option><option>展览</option><option>事件</option><option>潮玩</option></select>
        <select><option>全部来源</option><option>ARTnews</option><option>雅昌</option><option>Hypebeast</option></select>
        <select><option>全部状态</option><option>已发布</option><option>待审核</option><option>草稿</option></select>
        <input type="text" placeholder="搜索标题..." style="flex:1;min-width:180px" />
      </div>

      <div style="overflow-x:auto">
        <table class="news-table">
          <tr><th>标题</th><th>赛道</th><th>来源</th><th>状态</th><th>操作</th></tr>
          <tr><td>大都会挂出达·芬奇《纺车边的圣母》</td><td><span class="tag tag-exhibition">展览</span></td><td>ARTnews</td><td><span class="tag" style="color:var(--accent-deep);border-color:var(--accent);background:#EAF9F4">已发布</span></td><td class="action-icons"><button onclick="alert('编辑（原型）')">✏️</button><button onclick="alert('已删除（原型）')">🗑️</button></td></tr>
          <tr><td>高古轩放弃伦敦与巴塞尔空间</td><td><span class="tag tag-trade">交易</span></td><td>ARTnews</td><td><span class="tag" style="color:var(--accent-deep);border-color:var(--accent);background:#EAF9F4">已发布</span></td><td class="action-icons"><button>✏️</button><button>🗑️</button></td></tr>
          <tr><td>KAWS 推出「FELLOWS」乙烯基人偶系列</td><td><span class="tag tag-toy">潮玩</span></td><td>Hypebeast</td><td><span class="tag" style="color:var(--warn);border-color:var(--warn);background:#FFF1E8">待审核</span></td><td class="action-icons"><button>✏️</button><button>🗑️</button></td></tr>
          <tr><td>景德镇手工瓷业遗存申遗成功</td><td><span class="tag tag-event">事件</span></td><td>雅昌</td><td><span class="tag" style="color:var(--accent-deep);border-color:var(--accent);background:#EAF9F4">已发布</span></td><td class="action-icons"><button>✏️</button><button>🗑️</button></td></tr>
        </table>
      </div>
    </main>
  </div>
</body>
</html>
